workflows:
  android-workflow:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix Android folder
        script: |
          flutter create . --platforms=android --org com.oday.phone --project-name oday_phone
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - asaslam028@gmail.com
